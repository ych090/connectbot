name: Build Android APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Install Ant
      run: |
        sudo apt-get update
        sudo apt-get install -y ant

    - name: Update project.properties
      run: |
        sed -i 's/target=android-15/target=android-19/' project.properties

    - name: Build with Ant
      run: ant debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: connectbot-debug-apk
        path: bin/ConnectBot-debug.apk
