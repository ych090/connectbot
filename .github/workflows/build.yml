name: Build Android APK

on:
  push:
    branches: [ master, stable ]
  pull_request:
    branches: [ master, stable ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Download and extract legacy tools (Linux)
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        cd $ANDROID_HOME
        rm -rf tools tools_temp tools.zip
        curl -L -o tools.zip https://dl.google.com/android/repository/tools_r22-linux.zip
        unzip -o tools.zip
        mkdir -p tools/ant
        cp -r tools/* tools/ant/
        rm -rf tools
        rm -f tools.zip

    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Install Ant
      run: |
        sudo apt-get update
        sudo apt-get install -y ant

    - name: Update project.properties
      run: |
        sed -i 's/target=android-15/target=android-19/' project.properties

    - name: Build with Ant
      run: ant debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: connectbot-debug-apk
        path: bin/ConnectBot-debug.apk
